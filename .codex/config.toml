# Codex CLI: главный агент + максимум три профильных подагента.
# Профили наследуют модель и разрешения текущей сессии.
[agents]
max_concurrent_threads_per_session = 4
max_depth = 1

[agents.coder]
description = "Пишет и рефакторит VBA/C#/Python; единственный подагент с правом править назначенные исходники"
config_file = "../engineering-knowledge/agents/coder.toml"

[agents.api_expert]
description = "Проверяет точные сигнатуры и ограничения SolidWorks API/COM, не пишет макросы"
config_file = "../engineering-knowledge/agents/api_expert.toml"

[agents.debugger]
description = "Ищет причины сбоев, проверяет тесты и регрессии, не переписывает код без поручения"
config_file = "../engineering-knowledge/agents/debugger.toml"
