[agents.sw_document_output]
description = "Сохранение документов, PDF, пакетная обработка и производительность SolidWorks"
config_file = "../engineering-knowledge/agents/sw_document_output.toml"

[agents.sw_vba_com]
description = "Особенности SolidWorks VBA/COM, сигнатуры API и поставка Windows-макросов"
